<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./index.js" defer></script>
    <title>Library</title>
</head>
<body>
    <header class="header">
        <h1>Library</h1>
    </header>
    <main class="main">
        <button class="new-book">Add book</button>
        <section class="books"></section>
        <section class="fill-form">
            <dialog id="m-dialog">
                <form >
                    <ul>
                        <li>
                            <label for="author">Author</label>
                            <input type="text" id="author" name="author" required>
                        </li>
                        <li>
                            <label for="title">Title</label>
                            <input type="text" id="title" name="title" required>
                        </li>
                        <li>
                            <label for="pages">Pages</label>
                            <input type="number" id="pages" name="pages" required>
                        </li>
                        <li>
                            <label for="isRead">Have read</label>
                            <select name="isRead" id="isRead">
                                <option value="default">Yes</option>
                                <option>No</option>
                            </select>
                        </li>
                    </ul>
                    <ul>
                        <l1>
                            <button id="cancelBtn" value="cancel" formmethod="dialog">Cancel</button>
                        </l1>
                        <l1>
                            <button id="confirmBtn" value="default">Confirm</button>
                        </l1>
                    </ul>
                </form>

            </dialog>
        </section>
    </main>
  

</body>
</html>
